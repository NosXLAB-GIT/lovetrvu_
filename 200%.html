<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<title>I Love Trang</title>
<style>
  body
  {
    margin:0;
    background:#000;
    color:#fff;
    font-family:"Segoe UI",sans-serif;
  }
  #box
  {
    height:100vh;
    overflow-y:auto;
    padding:20px;
    white-space:pre;
    font-size:18px;
    line-height:1.6;
  }
  .beat
  {
    display:inline-block;
    animation:beat 0.9s infinite;
  }
  @keyframes beat
  {
    0%   { transform:scale(1); }
    25%  { transform:scale(1.15); }
    40%  { transform:scale(1); }
    60%  { transform:scale(1.12); }
    100% { transform:scale(1); }
  }
</style>
</head>
<body>
<div id="box"></div>
<script>
const box = document.getElementById("box");
const hearts = ["❤","🧡","💛","💚","💙","💜","🩷"];
let i = 1;
let le = 0;
let dir = 1;
let autoScroll = true; 
const timer = setInterval(() => {
  if(i > 200){
    box.innerHTML += "\n<span class='beat'>I Love Trang 🩷</span>";
    autoScroll = false;
    clearInterval(timer);
    return;
  }
  le += dir;
  if(le > 12) dir = -1;
  if(le < 0) dir = 1;
  const heart = hearts[(i-1) % hearts.length];
  box.innerHTML +=
    " ".repeat(le) +
    `I Love Trang ${i}%<span class="beat">${heart}</span>\n`;
  if(autoScroll){
    box.scrollTop = box.scrollHeight;
  }
  i++;
}, 60);
</script>
</body>
</html>
